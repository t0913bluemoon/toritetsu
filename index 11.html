<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>乗務記録簿 - 北海道スタンプラリー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 路線切り替えタブ -->
    <div class="tabs" id="tabs"></div>

    <!-- 路線の注釈 -->
    <div class="line-note" id="lineNote" style="display: none;"></div>

    <!-- 台帳ヘッダー -->
    <div class="ledger">
      <div class="ledger-stripe"></div>
      <div class="ledger-top">
        <span class="ledger-label">乗務記録簿</span>
        <span class="ledger-no" id="ledgerNo">NO. 0001</span>
      </div>
      <div class="ledger-main">
        <div>
          <div class="ledger-name" id="ledgerName"></div>
          <div class="ledger-sub" id="ledgerSub"></div>
        </div>
        <div class="ledger-count">
          <div>
            <span id="doneCount">0</span><span class="ledger-count-total" id="totalCount"> / 0</span>
          </div>
          <div class="ledger-count-label">駅 乗車済</div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <div class="progress-labels">
        <span id="originLabel">起点</span>
        <span class="progress-percent" id="percentLabel">0%</span>
        <span id="terminalLabel">終点</span>
      </div>
    </div>

    <!-- 駅トラック(すごろく) -->
    <div class="track-wrap">
      <div class="track" id="track">
        <div class="track-line"></div>
      </div>
    </div>
    <div class="track-hint">駅をタップして乗車日を記録</div>

    <!-- 乗車日入力ポップオーバー -->
    <div class="overlay hidden" id="overlay">
      <div class="popover">
        <div class="popover-title" id="popoverStationName"></div>
        <div class="popover-sub">いつ乗車しましたか?</div>
        <div class="date-selects">
          <select class="date-select year" id="selectYear"></select>
          <select class="date-select month" id="selectMonth"></select>
          <select class="date-select day" id="selectDay"></select>
        </div>
        <div class="popover-actions">
          <button class="btn btn-delete hidden" id="btnDelete">記録を削除</button>
          <button class="btn btn-confirm" id="btnConfirm">記録する</button>
        </div>
      </div>
    </div>

    <!-- 硬券カード -->
    <div class="ticket" id="ticket">
      <div class="ticket-holes">
        <div class="ticket-hole"></div>
        <div class="ticket-hole"></div>
        <div class="ticket-hole"></div>
        <div class="ticket-hole"></div>
        <div class="ticket-hole"></div>
      </div>
      <div class="ticket-body" id="ticketBody"></div>
    </div>

    <div class="reset-wrap">
      <button class="reset-btn" id="btnReset">リセット(お試し用)</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
