<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乗車ノート — 車両ログ & 旅程メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>乗車ノート</h1>
      <div class="sub">VEHICLE LOG &amp; TRIP NOTES</div>
    </div>
    <div class="stamp">乗車<br>記念</div>
  </header>

  <nav class="tabs">
    <button id="tabBtn-vehicle" class="active" onclick="switchTab('vehicle')">車両形式ログ</button>
    <button id="tabBtn-visit" onclick="switchTab('visit')">駅・バス記録</button>
    <button id="tabBtn-trip" onclick="switchTab('trip')">旅程メモ</button>
  </nav>

  <!-- 車両形式ログ -->
  <section id="panel-vehicle" class="panel active">
    <div class="form-card">
      <h2>新しい記録を追加</h2>
      <div class="field-row">
        <div class="field" style="max-width:120px;">
          <label>種別</label>
          <select id="v-type-kind">
            <option value="電車">電車</option>
            <option value="バス">バス</option>
          </select>
        </div>
        <div class="field">
          <label>撮影・乗車日</label>
          <input type="date" id="v-date">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>路線・系統名</label>
          <input type="text" id="v-line" placeholder="例：函館本線／〇〇系統">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>車両形式</label>
          <input type="text" id="v-type" placeholder="例：キハ261系">
        </div>
        <div class="field">
          <label>編成番号</label>
          <input type="text" id="v-formation" placeholder="例：HD-2」">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>写真</label>
          <input type="file" id="v-photo" accept="image/*">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>メモ</label>
          <textarea id="v-memo" placeholder="撮影地・天候・気づいたことなど"></textarea>
        </div>
      </div>
      <button class="submit-btn" id="v-submit-btn" onclick="addVehicle()">記録に加える</button>
      <button class="submit-btn" id="v-cancel-btn" onclick="cancelEditVehicle()" style="display:none;background:var(--line-gray);margin-top:6px;">編集をやめる</button>
    </div>

    <div class="list-title"><span>記録一覧</span><span id="v-count">0件</span></div>
    <div id="v-list"></div>
  </section>

  <!-- 駅・バス記録 -->
  <section id="panel-visit" class="panel">
    <div class="form-card">
      <h2>訪問記録を追加</h2>
      <div class="field-row">
        <div class="field" style="max-width:120px;">
          <label>種別</label>
          <select id="s-type">
            <option value="駅">駅</option>
            <option value="バス">バス</option>
          </select>
        </div>
        <div class="field">
          <label>名前</label>
          <input type="text" id="s-name" placeholder="例：石狩沼田駅／〇〇バス停">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>訪問日</label>
          <input type="date" id="s-date">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>写真</label>
          <input type="file" id="s-photo" accept="image/*">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>メモ</label>
          <textarea id="s-memo" placeholder="訪問時の様子・アクセス方法など"></textarea>
        </div>
      </div>
      <button class="submit-btn" id="s-submit-btn" onclick="addVisit()">記録に加える</button>
      <button class="submit-btn" id="s-cancel-btn" onclick="cancelEditVisit()" style="display:none;background:var(--line-gray);margin-top:6px;">編集をやめる</button>
    </div>

    <div class="list-title"><span>訪問記録一覧</span><span id="s-count">0件</span></div>
    <div id="s-list"></div>
  </section>

  <!-- 旅程メモ -->
  <section id="panel-trip" class="panel">
    <div class="form-card">
      <h2>次の目標を書き留める</h2>
      <div class="field-row">
        <div class="field">
          <label>行き先・目標</label>
          <input type="text" id="t-title" placeholder="例：東鹿越駅の廃線跡を歩く">
        </div>
        <div class="field" style="max-width:100px;">
          <label>優先度</label>
          <select id="t-priority">
            <option value="高">高</option>
            <option value="中" selected>中</option>
            <option value="低">低</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>メモ</label>
          <textarea id="t-memo" placeholder="行き方・季節・撮影候補地など"></textarea>
        </div>
      </div>
      <button class="submit-btn" id="t-submit-btn" onclick="addTrip()">目標に加える</button>
      <button class="submit-btn" id="t-cancel-btn" onclick="cancelEditTrip()" style="display:none;background:var(--line-gray);margin-top:6px;">編集をやめる</button>
    </div>

    <div class="list-title"><span>目標一覧</span><span id="t-count">0件</span></div>
    <div id="t-list"></div>
  </section>

  <footer>
    <a href="#" class="footer-link" id="menu-btn" onclick="toggleMenu();return false;">バックアップ</a>
    <div class="menu-panel" id="menu-panel">
      <button class="menu-item" onclick="exportBackup()">バックアップを書き出す</button>
      <button class="menu-item" onclick="document.getElementById('backup-file').click()">読み込んで復元</button>
      <input type="file" id="backup-file" accept="application/json" style="display:none" onchange="importBackup(event)">
      <div id="backup-status" class="backup-status"></div>
    </div>
  </footer>
</div>

<script src="script.js"></script>

</body>
</html>
